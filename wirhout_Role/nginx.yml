---
- name: Setup NGINX without roles
  hosts: web
  become: yes

  vars:
    nginx_listen_port: 80
    nginx_server_name: localhost
    nginx_root_dir: /var/www/html

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Deploy custom NGINX configuration from template
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'

    - name: Ensure nginx is running and enabled
      service:
        name: nginx
        state: restarted
        enabled: yes
